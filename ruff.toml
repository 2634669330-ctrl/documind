line-length = 120
target-version = "py310"
extend-exclude = [".venv", "data", ".pytest-data", "*.egg-info"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI 的 Depends / File 就写在默认参数上，属于官方推荐写法
    "UP017",  # datetime.UTC 需要 Python 3.11，项目兼容 3.10
    "RUF001", # 中文全角标点会被判为“易混淆字符”
    "RUF002",
    "RUF003",
]

[lint.isort]
known-first-party = ["app"]
